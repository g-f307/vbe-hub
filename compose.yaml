name: vbe-hub

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?configure POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?configure POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${POSTGRES_APP_USER:?configure POSTGRES_APP_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?configure POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-bootstrap.sh:/docker-entrypoint-initdb.d/001-bootstrap.sh:ro
      - ./infra/postgres/002-bootstrap.sql:/opt/vbe-hub/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      REVIEW_ACTOR_ID: ${REVIEW_ACTOR_ID:-synthetic-analyst}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-15}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-12000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  relation-worker:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-15}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-12000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      RELATED_QUEUE_CAPACITY: ${RELATED_QUEUE_CAPACITY:-1000}
      RELATED_NEIGHBOR_LIMIT: ${RELATED_NEIGHBOR_LIMIT:-20}
      RELATED_CANDIDATE_LIMIT: ${RELATED_CANDIDATE_LIMIT:-3}
      RELATED_MINIMUM_SEMANTIC_SCORE: ${RELATED_MINIMUM_SEMANTIC_SCORE:-0.65}
      RELATED_MINIMUM_TOTAL_SCORE: ${RELATED_MINIMUM_TOTAL_SCORE:-0.55}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.related_worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      VBE_API_INTERNAL_URL: ${VBE_API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((response) => { if (!response.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "pytest"]

  unit-test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://unit:unit@not-used:5432/unit
      REDIS_URL: redis://not-used:6379/0
    command: ["uv", "run", "--no-sync", "pytest", "-m", "not integration", "tests/unit"]

  integration-test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "pytest", "-m", "integration", "tests/integration"]

  lint:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    command: ["uv", "run", "--no-sync", "ruff", "check", "--no-cache", "."]

  frontend-lint:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: development
    command: ["pnpm", "lint"]

  frontend-test:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: development
    command: ["pnpm", "test"]

  docs-check:
    profiles: ["tools"]
    image: python:3.12.8-slim-bookworm
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["python", "scripts/audit_docs.py", "--root", "/workspace", "--strict"]

  synthetic-generate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/generated:/data/generated
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "generate",
        "--output",
        "/data/generated",
        "--seed",
        "${SYNTHETIC_SEED:-307}",
        "--total-records",
        "${SYNTHETIC_TOTAL_RECORDS:-120}",
        "--media-ratio",
        "${SYNTHETIC_MEDIA_RATIO:-0.6}",
        "--event-count",
        "${SYNTHETIC_EVENT_COUNT:-12}",
      ]

  synthetic-import:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/generated:/data/generated:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "import",
        "--records",
        "/data/generated/records.jsonl",
        "--gold",
        "/data/generated/gold.json",
      ]

  demo-load:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.synthetic", "demo-load"]

  synthetic-validate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/generated:/data/generated:ro
      - ./data/reports:/data/reports
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "validate",
        "--input",
        "/data/generated",
        "--report",
        "/data/reports/synthetic-validation.json",
      ]

  correlation-evaluate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/evaluation:/data/evaluation:ro
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.correlation_command",
        "--input", "/data/evaluation/correlation-input.json",
        "--output", "/data/reports",
      ]

  correlation-live-evaluate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.correlation_live",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  relation-calibrate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: 60
      GEMINI_MAX_ATTEMPTS: 3
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.relation_experiment",
        "--split", "calibration",
        "--cases-per-relation", "10",
        "--seed", "3040",
        "--repetitions", "1",
        "--concurrency", "1",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  relation-live-evaluate-v3:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: 60
      GEMINI_MAX_ATTEMPTS: 3
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.relation_experiment",
        "--split", "evaluation",
        "--cases-per-relation", "10",
        "--seed", "4040",
        "--repetitions", "1",
        "--concurrency", "1",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  grouping-evaluate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.grouping_experiment",
        "--split", "evaluation",
        "--event-count", "60",
        "--seed", "5170",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--bootstrap-iterations", "500",
        "--output", "/data/reports",
      ]

  integrated-evaluate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/generated:/data/generated:ro
      - ./data/reports:/data/reports
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.integrated_experiment",
        "--manifest", "/data/generated/manifest.json",
        "--validation", "/data/reports/synthetic-validation.json",
        "--metrics-url", "http://api:8000/metrics/summary",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  gemini-live:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
    command: ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.ai_live"]

  technical-sheet-evaluate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
    volumes:
      - ./data/reports:/data/reports
    command: ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.evaluation", "--split", "${EVALUATION_SPLIT:-calibration}", "--output", "/data/reports"]

  technical-sheet-evaluate-openai:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-15}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-12000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.10}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0.50}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.openai_live",
        "--split", "${EVALUATION_SPLIT:-calibration}",
        "--output", "/data/reports",
      ]

  related-signals-evaluate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://evaluation:not-used@not-used:5432/evaluation
      REDIS_URL: redis://not-used:6379/0
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.related_signals_command",
        "--capture", "/app/src/vbe_hub/evaluation/assets/related-signals-recorded-v1.json",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  related-signals-evaluate-openai:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://evaluation:not-used@not-used:5432/evaluation
      REDIS_URL: redis://not-used:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-15}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-12000}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.10}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-0.50}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.related_signals_live",
        "--cases-per-relation", "${RELATED_EVALUATION_CASES_PER_RELATION:-1}",
        "--seed", "${RELATED_EVALUATION_SEED:-4040}",
        "--output", "/data/reports",
      ]

  n8n-import:
    profiles: ["demo"]
    image: n8nio/n8n:2.46.6
    user: "node"
    environment: &n8n-environment
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-change-me}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_SAMESITE_COOKIE: strict
      GENERIC_TIMEZONE: America/Manaus
      TZ: America/Manaus
    volumes:
      - n8n_demo_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
    command: ["import:workflow", "--input=/workflows/vbe-hub-demo.json"]
    restart: "no"

  n8n:
    profiles: ["demo"]
    image: n8nio/n8n:2.46.6
    user: "node"
    environment: *n8n-environment
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_demo_data:/home/node/.n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_demo_data:
