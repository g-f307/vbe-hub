name: vbe-hub

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?configure POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?configure POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${POSTGRES_APP_USER:?configure POSTGRES_APP_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?configure POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-bootstrap.sh:/docker-entrypoint-initdb.d/001-bootstrap.sh:ro
      - ./infra/postgres/002-bootstrap.sql:/opt/vbe-hub/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "pytest"]

  unit-test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://unit:unit@not-used:5432/unit
      REDIS_URL: redis://not-used:6379/0
    command: ["uv", "run", "--no-sync", "pytest", "-m", "not integration", "tests/unit"]

  integration-test:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "pytest", "-m", "integration", "tests/integration"]

  lint:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    command: ["uv", "run", "--no-sync", "ruff", "check", "--no-cache", "."]

  docs-check:
    profiles: ["tools"]
    image: python:3.12.8-slim-bookworm
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["python", "scripts/audit_docs.py", "--root", "/workspace", "--strict"]

  synthetic-generate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/generated:/data/generated
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "generate",
        "--output",
        "/data/generated",
        "--seed",
        "${SYNTHETIC_SEED:-307}",
        "--total-records",
        "${SYNTHETIC_TOTAL_RECORDS:-120}",
        "--media-ratio",
        "${SYNTHETIC_MEDIA_RATIO:-0.6}",
        "--event-count",
        "${SYNTHETIC_EVENT_COUNT:-12}",
      ]

  synthetic-import:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/generated:/data/generated:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "import",
        "--records",
        "/data/generated/records.jsonl",
        "--gold",
        "/data/generated/gold.json",
      ]

  synthetic-validate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/generated:/data/generated:ro
      - ./data/reports:/data/reports
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "vbe_hub.synthetic",
        "validate",
        "--input",
        "/data/generated",
        "--report",
        "/data/reports/synthetic-validation.json",
      ]

  correlation-evaluate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./data/evaluation:/data/evaluation:ro
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.correlation_command",
        "--input", "/data/evaluation/correlation-input.json",
        "--output", "/data/reports",
      ]

  correlation-live-evaluate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.correlation_live",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  relation-calibrate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: 60
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.relation_experiment",
        "--split", "calibration",
        "--cases-per-relation", "10",
        "--seed", "3040",
        "--repetitions", "1",
        "--concurrency", "4",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  relation-live-evaluate-v2:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: 60
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./data/reports:/data/reports
    command:
      [
        "uv", "run", "--no-sync", "python", "-m",
        "vbe_hub.evaluation.relation_experiment",
        "--split", "evaluation",
        "--cases-per-relation", "50",
        "--seed", "4040",
        "--repetitions", "2",
        "--concurrency", "4",
        "--commit", "${EVALUATION_COMMIT:-working-tree}",
        "--output", "/data/reports",
      ]

  gemini-live:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
    command: ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.ai_live"]

  technical-sheet-evaluate:
    profiles: ["live"]
    build:
      context: ./backend
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: postgresql://live:not-used@not-used:5432/live
      REDIS_URL: redis://not-used:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-12000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
    volumes:
      - ./data/reports:/data/reports
    command: ["uv", "run", "--no-sync", "python", "-m", "vbe_hub.evaluation", "--split", "${EVALUATION_SPLIT:-calibration}", "--output", "/data/reports"]

volumes:
  postgres_data:
  redis_data:
