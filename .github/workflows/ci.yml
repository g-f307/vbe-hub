name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Verify health endpoints
        run: |
          docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
          docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"

      - name: Run tests
        run: docker compose --profile tools run --rm test

      - name: Run lint
        run: docker compose --profile tools run --rm lint

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the ephemeral stack
        if: always()
        run: docker compose down --volumes
