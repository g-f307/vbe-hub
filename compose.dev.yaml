services:
  api:
    build:
      target: development
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "uvicorn",
        "vbe_hub.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
